<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'><meta name='theme-color' content='#245c35'><title>Controle Gado</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f2;color:#222}header{background:#245c35;color:#fff;padding:16px;text-align:center}header h1{font-size:22px;margin:0}header p{margin:5px 0 0;font-size:13px}.wrap{max-width:1050px;margin:auto;padding:12px}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.menu button,.btn{border:0;border-radius:9px;padding:13px;font-weight:700;cursor:pointer;background:#fff;box-shadow:0 1px 5px #0002}.menu button.active{background:#dfeadf;color:#174c2b}.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 6px #0002}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{font-size:12px;font-weight:700}input,select,textarea{width:100%;padding:10px;border:1px solid #c9cec9;border-radius:7px;margin-top:4px;font-size:15px}textarea{min-height:70px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.save{background:#245c35;color:#fff}.danger{background:#b83232;color:#fff}.secondary{background:#e7e9e7}.list{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}th{background:#eef2ed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;padding:12px;border-radius:9px;text-align:center;box-shadow:0 1px 5px #0001}.stat b{font-size:22px;color:#245c35}.note{font-size:12px;color:#666;margin-top:10px}@media(max-width:700px){.menu{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{padding:12px}.wrap{padding:8px}}
</style></head><body><header><h1>CONTROLE GADO</h1><p>AGROPECUÁRIA PAINEIRA</p></header><main class='wrap'>
<div class='stats'><div class='stat'><b id='sM'>0</b><br>Matrizes</div><div class='stat'><b id='sT'>0</b><br>Terneiros</div><div class='stat'><b id='sN'>0</b><br>Nascimentos</div><div class='stat'><b id='sH'>0</b><br>Manejos</div></div>
<nav class='menu'><button class='active' onclick="show('matrizes',this)">MATRIZES</button><button onclick="show('nascimentos',this)">NASCIMENTOS</button><button onclick="show('manejos',this)">MANEJOS</button><button onclick="show('relatorios',this)">RELATÓRIOS</button></nav>
<section id='matrizes' class='card'><h2>MATRIZES</h2><div class='grid'><label>Brinco<input id='mBrinco'></label><label>Categoria<select id='mCat'><option>VACA</option><option>NOVILHA</option></select></label><label>Raça<select id='mRaca'><option>ANGUS</option><option>RED ANGUS</option><option>BRANGUS</option><option>BRAFORD</option><option>CHAROLÊS</option><option>NELORE</option></select></label><label>Ano Safra<input id='mAno' type='number' min='2000' max='2050'></label><label>Campo / Lote<input id='mCampo'></label><label>Situação<input id='mSit' placeholder='Ex.: IATF, TOURO, PRENHA'></label></div><label>Observação<textarea id='mObs'></textarea></label><div class='actions'><button class='btn save' onclick='salvarMatriz()'>SALVAR</button><button class='btn secondary' onclick='limparMatriz()'>LIMPAR</button></div><div class='list' id='listaM'></div></section>
<section id='nascimentos' class='card hidden'><h2>NASCIMENTOS</h2><div class='grid'><label>Brinco do terneiro<input id='nBrinco'></label><label>Matriz / Mãe<select id='nMae'></select></label><label>Data do nascimento<input id='nData' type='date'></label><label>Sexo<select id='nSexo'><option>MACHO</option><option>FÊMEA</option></select></label><label>Raça<input id='nRaca'></label><label>Peso ao nascer (kg)<input id='nPeso' type='number' step='0.1'></label></div><label>Observação<textarea id='nObs'></textarea></label><div class='actions'><button class='btn save' onclick='salvarNascimento()'>SALVAR</button><button class='btn secondary' onclick='limparNascimento()'>LIMPAR</button></div><div class='list' id='listaN'></div></section>
<section id='manejos' class='card hidden'><h2>MANEJOS</h2><div class='grid'><label>Animal<select id='hAnimal'></select></label><label>Data<input id='hData' type='date'></label><label>Tipo<select id='hTipo'><option>VACINAÇÃO</option><option>VERMÍFUGO</option><option>MEDICAÇÃO</option><option>PESAGEM</option><option>DESMAME</option><option>CASTRAÇÃO</option><option>TROCA DE CAMPO</option><option>OUTRO</option></select></label></div><label>Descrição / Observação<textarea id='hObs'></textarea></label><div class='actions'><button class='btn save' onclick='salvarManejo()'>SALVAR</button></div><div class='list' id='listaH'></div></section>
<section id='relatorios' class='card hidden'><h2>RELATÓRIOS</h2><p>Resumo dos dados cadastrados.</p><div class='actions'><button class='btn' onclick='window.print()'>IMPRIMIR</button><button class='btn' onclick='exportar()'>EXPORTAR BACKUP</button><label class='btn'>IMPORTAR BACKUP<input type='file' accept='.json' onchange='importar(event)' style='display:none'></label></div><div id='relatorio' class='list'></div><p class='note'>Nesta V1 os dados ficam salvos neste navegador. A próxima etapa será conectar o Firebase/Firestore para sincronizar celular e computador.</p></section>
</main><script>
let db=JSON.parse(localStorage.getItem('controleGadoV1')||'{"matrizes":[],"nascimentos":[],"manejos":[]}');
function persist(){localStorage.setItem('controleGadoV1',JSON.stringify(db));render()}
function show(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function v(id){return document.getElementById(id).value.trim()}
function salvarMatriz(){let br=v('mBrinco');if(!br)return alert('Informe o brinco.');if(db.matrizes.some(x=>x.brinco===br))return alert('Brinco já cadastrado.');db.matrizes.push({brinco:br,categoria:v('mCat'),raca:v('mRaca'),ano:v('mAno'),campo:v('mCampo'),situacao:v('mSit'),obs:v('mObs')});limparMatriz();persist()}
function limparMatriz(){['mBrinco','mAno','mCampo','mSit','mObs'].forEach(x=>document.getElementById(x).value='')}
function salvarNascimento(){let br=v('nBrinco'),mae=v('nMae');if(!br||!mae)return alert('Informe brinco e matriz/mãe.');if(db.nascimentos.some(x=>x.brinco===br)||db.matrizes.some(x=>x.brinco===br))return alert('Brinco já cadastrado.');db.nascimentos.push({brinco:br,mae,data:v('nData'),sexo:v('nSexo'),raca:v('nRaca'),peso:v('nPeso'),obs:v('nObs')});limparNascimento();persist()}
function limparNascimento(){['nBrinco','nData','nRaca','nPeso','nObs'].forEach(x=>document.getElementById(x).value='')}
function salvarManejo(){if(!v('hAnimal')||!v('hData'))return alert('Informe animal e data.');db.manejos.push({animal:v('hAnimal'),data:v('hData'),tipo:v('hTipo'),obs:v('hObs')});document.getElementById('hObs').value='';persist()}
function del(tipo,i){if(confirm('Excluir este registro?')){db[tipo].splice(i,1);persist()}}
function render(){db.matrizes.sort((a,b)=>a.brinco.localeCompare(b.brinco,undefined,{numeric:true}));document.getElementById('sM').textContent=db.matrizes.length;document.getElementById('sT').textContent=db.nascimentos.length;document.getElementById('sN').textContent=db.nascimentos.length;document.getElementById('sH').textContent=db.manejos.length;
let mae=document.getElementById('nMae');mae.innerHTML='<option value="">SELECIONE</option>'+db.matrizes.map(x=>`<option>${x.brinco}</option>`).join('');let animais=[...db.matrizes.map(x=>'MATRIZ '+x.brinco),...db.nascimentos.map(x=>'TERNEIRO '+x.brinco)];document.getElementById('hAnimal').innerHTML='<option value="">SELECIONE</option>'+animais.map(x=>`<option>${x}</option>`).join('');
document.getElementById('listaM').innerHTML='<table><tr><th>Brinco</th><th>Categoria</th><th>Raça</th><th>Campo</th><th>Situação</th><th></th></tr>'+db.matrizes.map((x,i)=>`<tr><td>${x.brinco}</td><td>${x.categoria}</td><td>${x.raca}</td><td>${x.campo}</td><td>${x.situacao}</td><td><button onclick="del('matrizes',${i})">Excluir</button></td></tr>`).join('')+'</table>';
document.getElementById('listaN').innerHTML='<table><tr><th>Terneiro</th><th>Mãe</th><th>Data</th><th>Sexo</th><th>Peso</th><th></th></tr>'+db.nascimentos.map((x,i)=>`<tr><td>${x.brinco}</td><td>${x.mae}</td><td>${x.data}</td><td>${x.sexo}</td><td>${x.peso}</td><td><button onclick="del('nascimentos',${i})">Excluir</button></td></tr>`).join('')+'</table>';
document.getElementById('listaH').innerHTML='<table><tr><th>Data</th><th>Animal</th><th>Tipo</th><th>Observação</th><th></th></tr>'+db.manejos.map((x,i)=>`<tr><td>${x.data}</td><td>${x.animal}</td><td>${x.tipo}</td><td>${x.obs}</td><td><button onclick="del('manejos',${i})">Excluir</button></td></tr>`).join('')+'</table>';
document.getElementById('relatorio').innerHTML=`<h3>Matrizes (${db.matrizes.length})</h3>`+db.matrizes.map(x=>`${x.brinco} — ${x.categoria} — ${x.raca}`).join('<br>')+`<h3>Nascimentos (${db.nascimentos.length})</h3>`+db.nascimentos.map(x=>`${x.brinco} — mãe ${x.mae} — ${x.sexo} — ${x.data}`).join('<br>')}
function exportar(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-controle-gado.json';a.click()}
function importar(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);persist();alert('Backup importado.')}catch{alert('Arquivo inválido.')}};r.readAsText(f)}render();
</script></body></html>
