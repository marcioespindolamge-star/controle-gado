<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'><meta name='theme-color' content='#245c35'><title>Controle Gado</title>
<!-- Firebase config corrigida 2026-09-20 --><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f2;color:#222}header{background:#245c35;color:#fff;padding:16px;text-align:center}header h1{font-size:22px;margin:0}header p{margin:5px 0 0;font-size:13px}.wrap{max-width:1050px;margin:auto;padding:12px}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.menu button,.btn{border:0;border-radius:9px;padding:13px;font-weight:700;cursor:pointer;background:#fff;box-shadow:0 1px 5px #0002}.menu button.active{background:#dfeadf;color:#174c2b}.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 6px #0002}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{font-size:12px;font-weight:700}input,select,textarea{width:100%;padding:10px;border:1px solid #c9cec9;border-radius:7px;margin-top:4px;font-size:15px}textarea{min-height:70px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.save{background:#245c35;color:#fff}.danger{background:#b83232;color:#fff}.secondary{background:#e7e9e7}.list{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}th{background:#eef2ed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;padding:12px;border-radius:9px;text-align:center;box-shadow:0 1px 5px #0001}.stat b{font-size:22px;color:#245c35}.note{font-size:12px;color:#666;margin-top:10px}.login{max-width:420px;margin:55px auto}.login h2{text-align:center;color:#245c35}.login .btn{width:100%;margin-top:12px}.topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}.sync{color:#245c35;font-weight:700}.logout{padding:7px 10px}.error{color:#b83232;font-size:13px;margin-top:10px}.loading{text-align:center;padding:30px}@media(max-width:700px){.menu{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{padding:12px}.wrap{padding:8px}}
</style></head><body><header><h1>CONTROLE GADO</h1><p>AGROPECUÁRIA PAINEIRA</p></header><main class='wrap'><section id='loginBox' class='card login'><h2>ENTRAR</h2><label>E-mail<input id='loginEmail' type='email' autocomplete='username'></label><label>Senha<input id='loginSenha' type='password' autocomplete='current-password'></label><button class='btn save' id='btnEntrar'>ENTRAR</button><div id='loginErro' class='error'></div></section><div id='appBox' class='hidden'><div class='topbar'><span id='usuarioEmail'></span><span class='sync'>● BANCO ONLINE</span><button class='btn secondary logout' id='btnSair'>SAIR</button></div>
<div class='stats'><div class='stat'><b id='sM'>0</b><br>Matrizes</div><div class='stat'><b id='sT'>0</b><br>Terneiros</div><div class='stat'><b id='sN'>0</b><br>Nascimentos</div><div class='stat'><b id='sH'>0</b><br>Manejos</div></div>
<nav class='menu'><button class='active' onclick="show('matrizes',this)">MATRIZES</button><button onclick="show('nascimentos',this)">NASCIMENTOS</button><button onclick="show('manejos',this)">MANEJOS</button><button onclick="show('relatorios',this)">RELATÓRIOS</button></nav>
<section id='matrizes' class='card'><h2>MATRIZES</h2><div class='grid'><label>Brinco<input id='mBrinco'></label><label>Categoria<select id='mCat'><option>VACA</option><option>NOVILHA</option></select></label><label>Raça<select id='mRaca'><option>ANGUS</option><option>RED ANGUS</option><option>BRANGUS</option><option>BRAFORD</option><option>CHAROLÊS</option><option>NELORE</option></select></label><label>Ano Safra<input id='mAno' type='number' min='2000' max='2050'></label><label>Campo / Lote<input id='mCampo'></label><label>Situação<input id='mSit' placeholder='Ex.: IATF, TOURO, PRENHA'></label></div><label>Observação<textarea id='mObs'></textarea></label><div class='actions'><button class='btn save' onclick='salvarMatriz()'>SALVAR</button><button class='btn secondary' onclick='limparMatriz()'>LIMPAR</button></div><div class='list' id='listaM'></div></section>
<section id='nascimentos' class='card hidden'><h2>NASCIMENTOS</h2><div class='grid'><label>Brinco do terneiro<input id='nBrinco'></label><label>Matriz / Mãe<select id='nMae'></select></label><label>Data do nascimento<input id='nData' type='date'></label><label>Sexo<select id='nSexo'><option>MACHO</option><option>FÊMEA</option></select></label><label>Raça<input id='nRaca'></label><label>Peso ao nascer (kg)<input id='nPeso' type='number' step='0.1'></label></div><label>Observação<textarea id='nObs'></textarea></label><div class='actions'><button class='btn save' onclick='salvarNascimento()'>SALVAR</button><button class='btn secondary' onclick='limparNascimento()'>LIMPAR</button></div><div class='list' id='listaN'></div></section>
<section id='manejos' class='card hidden'><h2>MANEJOS</h2><div class='grid'><label>Animal<select id='hAnimal'></select></label><label>Data<input id='hData' type='date'></label><label>Tipo<select id='hTipo'><option>VACINAÇÃO</option><option>VERMÍFUGO</option><option>MEDICAÇÃO</option><option>PESAGEM</option><option>DESMAME</option><option>CASTRAÇÃO</option><option>TROCA DE CAMPO</option><option>OUTRO</option></select></label></div><label>Descrição / Observação<textarea id='hObs'></textarea></label><div class='actions'><button class='btn save' onclick='salvarManejo()'>SALVAR</button></div><div class='list' id='listaH'></div></section>
<section id='relatorios' class='card hidden'><h2>RELATÓRIOS</h2><p>Resumo dos dados cadastrados.</p><div class='actions'><button class='btn' onclick='window.print()'>IMPRIMIR</button><button class='btn' onclick='exportar()'>EXPORTAR BACKUP</button><label class='btn'>IMPORTAR BACKUP<input type='file' accept='.json' onchange='importar(event)' style='display:none'></label></div><div id='relatorio' class='list'></div><p class='note'>Dados salvos no Firebase/Firestore e sincronizados entre celular e computador após o login.</p></section>
</div></main><script type='module'>
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5zdEMms8-q3RsI-aTr1Cf0vNiBhDTTS8",
  authDomain: "controle-gado-a3396.firebaseapp.com",
  projectId: "controle-gado-a3396",
  storageBucket: "controle-gado-a3396.firebasestorage.app",
  messagingSenderId: "371357384445",
  appId: "1:371357384445:web:fd52e363ceee321a464894"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), fs=getFirestore(app);
let db={matrizes:[],nascimentos:[],manejos:[]}, unsubs=[];
const $=id=>document.getElementById(id), v=id=>$(id).value.trim();
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id,b){document.querySelectorAll('#appBox main section, #appBox section.card').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
window.show=show;
$('btnEntrar').onclick=async()=>{
  $('loginErro').textContent='';
  const email=v('loginEmail');
  const senha=v('loginSenha');
  if(!email||!senha){$('loginErro').textContent='Informe o e-mail e a senha.';return;}
  try{
    await signInWithEmailAndPassword(auth,email,senha);
  }catch(e){
    console.error('Firebase Auth:', e);
    const mapa={
      'auth/invalid-credential':'E-mail ou senha não conferem com o usuário cadastrado.',
      'auth/invalid-email':'O endereço de e-mail é inválido.',
      'auth/user-disabled':'Este usuário está desativado no Firebase.',
      'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
      'auth/network-request-failed':'Falha de conexão com o Firebase. Verifique a internet.',
      'auth/unauthorized-domain':'Este endereço do GitHub Pages ainda não está autorizado no Firebase.'
    };
    $('loginErro').textContent=(mapa[e.code]||'Erro no login')+' ['+(e.code||'sem-código')+']';
  }
};
$('loginSenha').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnEntrar').click()});
$('btnSair').onclick=()=>signOut(auth);
function stopListeners(){unsubs.forEach(f=>f());unsubs=[]}
function listen(){stopListeners(); for(const nome of ['matrizes','nascimentos','manejos']) unsubs.push(onSnapshot(collection(fs,nome),snap=>{db[nome]=snap.docs.map(d=>({id:d.id,...d.data()}));render()},()=>alert('Não foi possível acessar o banco de dados.')))}
onAuthStateChanged(auth,user=>{if(user){$('loginBox').classList.add('hidden');$('appBox').classList.remove('hidden');$('usuarioEmail').textContent=user.email||'';listen()}else{stopListeners();db={matrizes:[],nascimentos:[],manejos:[]};$('appBox').classList.add('hidden');$('loginBox').classList.remove('hidden');$('loginSenha').value='';render()}});
async function salvarMatriz(){let br=v('mBrinco');if(!br)return alert('Informe o brinco.');if(db.matrizes.some(x=>x.brinco===br)||db.nascimentos.some(x=>x.brinco===br))return alert('Brinco já cadastrado.');await addDoc(collection(fs,'matrizes'),{brinco:br,categoria:v('mCat'),raca:v('mRaca'),ano:v('mAno'),campo:v('mCampo'),situacao:v('mSit'),obs:v('mObs'),criadoEm:serverTimestamp()});limparMatriz()}
function limparMatriz(){['mBrinco','mAno','mCampo','mSit','mObs'].forEach(x=>$(x).value='')}
async function salvarNascimento(){let br=v('nBrinco'),mae=v('nMae');if(!br||!mae)return alert('Informe brinco e matriz/mãe.');if(db.nascimentos.some(x=>x.brinco===br)||db.matrizes.some(x=>x.brinco===br))return alert('Brinco já cadastrado.');await addDoc(collection(fs,'nascimentos'),{brinco:br,mae,data:v('nData'),sexo:v('nSexo'),raca:v('nRaca'),peso:v('nPeso'),obs:v('nObs'),criadoEm:serverTimestamp()});limparNascimento()}
function limparNascimento(){['nBrinco','nData','nRaca','nPeso','nObs'].forEach(x=>$(x).value='')}
async function salvarManejo(){if(!v('hAnimal')||!v('hData'))return alert('Informe animal e data.');await addDoc(collection(fs,'manejos'),{animal:v('hAnimal'),data:v('hData'),tipo:v('hTipo'),obs:v('hObs'),criadoEm:serverTimestamp()});$('hObs').value=''}
async function del(tipo,id){if(confirm('Excluir este registro?'))await deleteDoc(doc(fs,tipo,id))}
Object.assign(window,{salvarMatriz,limparMatriz,salvarNascimento,limparNascimento,salvarManejo,del});
function render(){db.matrizes.sort((a,b)=>String(a.brinco).localeCompare(String(b.brinco),undefined,{numeric:true}));db.nascimentos.sort((a,b)=>String(a.brinco).localeCompare(String(b.brinco),undefined,{numeric:true}));$('sM').textContent=db.matrizes.length;$('sT').textContent=db.nascimentos.length;$('sN').textContent=db.nascimentos.length;$('sH').textContent=db.manejos.length;
$('nMae').innerHTML='<option value="">SELECIONE</option>'+db.matrizes.map(x=>`<option>${esc(x.brinco)}</option>`).join('');let animais=[...db.matrizes.map(x=>'MATRIZ '+x.brinco),...db.nascimentos.map(x=>'TERNEIRO '+x.brinco)];$('hAnimal').innerHTML='<option value="">SELECIONE</option>'+animais.map(x=>`<option>${esc(x)}</option>`).join('');
$('listaM').innerHTML='<table><tr><th>Brinco</th><th>Categoria</th><th>Raça</th><th>Campo</th><th>Situação</th><th></th></tr>'+db.matrizes.map(x=>`<tr><td>${esc(x.brinco)}</td><td>${esc(x.categoria)}</td><td>${esc(x.raca)}</td><td>${esc(x.campo)}</td><td>${esc(x.situacao)}</td><td><button onclick="del(\'matrizes\',\'${x.id}\')">Excluir</button></td></tr>`).join('')+'</table>';
$('listaN').innerHTML='<table><tr><th>Terneiro</th><th>Mãe</th><th>Data</th><th>Sexo</th><th>Peso</th><th></th></tr>'+db.nascimentos.map(x=>`<tr><td>${esc(x.brinco)}</td><td>${esc(x.mae)}</td><td>${esc(x.data)}</td><td>${esc(x.sexo)}</td><td>${esc(x.peso)}</td><td><button onclick="del(\'nascimentos\',\'${x.id}\')">Excluir</button></td></tr>`).join('')+'</table>';
$('listaH').innerHTML='<table><tr><th>Data</th><th>Animal</th><th>Tipo</th><th>Observação</th><th></th></tr>'+db.manejos.map(x=>`<tr><td>${esc(x.data)}</td><td>${esc(x.animal)}</td><td>${esc(x.tipo)}</td><td>${esc(x.obs)}</td><td><button onclick="del(\'manejos\',\'${x.id}\')">Excluir</button></td></tr>`).join('')+'</table>';
$('relatorio').innerHTML=`<h3>Matrizes (${db.matrizes.length})</h3>`+db.matrizes.map(x=>`${esc(x.brinco)} — ${esc(x.categoria)} — ${esc(x.raca)}`).join('<br>')+`<h3>Nascimentos (${db.nascimentos.length})</h3>`+db.nascimentos.map(x=>`${esc(x.brinco)} — mãe ${esc(x.mae)} — ${esc(x.sexo)} — ${esc(x.data)}`).join('<br>')}
function exportar(){let clean={matrizes:db.matrizes.map(({id,criadoEm,...x})=>x),nascimentos:db.nascimentos.map(({id,criadoEm,...x})=>x),manejos:db.manejos.map(({id,criadoEm,...x})=>x)};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(clean,null,2)],{type:'application/json'}));a.download='backup-controle-gado.json';a.click();URL.revokeObjectURL(a.href)}
async function importar(e){let f=e.target.files[0];if(!f)return;try{let dados=JSON.parse(await f.text());if(!confirm('Importar os registros deste backup para o banco online?'))return;for(const nome of ['matrizes','nascimentos','manejos'])for(const x of (dados[nome]||[]))await addDoc(collection(fs,nome),{...x,criadoEm:serverTimestamp()});alert('Backup importado para o banco online.')}catch{alert('Arquivo inválido.')}e.target.value=''}
Object.assign(window,{exportar,importar});render();
</script></body></html>
